baseURL = "https://wmh6525.github.io/blog/"
languageCode = "ko"
title = "Research Lab"
theme = "PaperMod"

# 한국어 설정
defaultContentLanguage = "ko"
hasCJKLanguage = true

[params]
  author = "wmh6525"
  description = "ML/AI 연구 노트, 논문 리뷰, 코드 구현 기록"
  env = "production"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = "auto"
  disableThemeToggle = false

  [params.homeInfoParams]
    Title = "Research Lab"
    Content = "ML/AI 연구 노트 · 논문 리뷰 · 코드 구현 기록\n\n처음 읽는다면 [AI 기초 설명](/blog/ai-basics/)부터 시작하세요. [학습 순서](/blog/learn/)에서 관심 분야를 고르고, [선수 논문 지도](/blog/paper-prerequisites/)로 필요한 개념을 연결할 수 있습니다."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/wmh6525"

# 수식 지원 (KaTeX)
[params.math]
  enable = true

# 코드 하이라이팅 + 수식(LaTeX) Passthrough
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  # 수식이 markdown 파서에 의해 깨지지 않도록 통과 (Hugo 0.122+)
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]

